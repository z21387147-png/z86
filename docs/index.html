    function makeScoreBadge(score, logs, title) {
      const cls = score > 0 ? 'score-pos' : (score < 0 ? 'score-neg' : 'score-zero');
      const txt = score > 0 ? `+${score}分` : `${score}分`;
      const logsHtml = (logs || []).map(l => `<div>• ${l}</div>`).join('');
      return `
        <br>
        <div class="hover-trigger">
          <span class="cand-score ${cls}">🤖 ${txt}</span>
          <div class="tooltip">
            <span class="tooltip-title">${title}｜加減分明細</span>
            <div class="detail-list">${logsHtml}</div>
          </div>
        </div>
      `;
    }

    function renderTable(filter = 'all') {
      const tbody = document.getElementById('election-tbody');
      tbody.innerHTML = '';

      const filteredData = electionData.filter(item => {
        if (filter === 'all') return true;
        if (filter === 'six') return item.region === 'six';
        if (filter === 'north') return item.area === 'north';
        if (filter === 'central') return item.area === 'central';
        if (filter === 'south_east') return item.area === 'south_east';
        if (filter === 'tossup') return item.statusType === 'tossup';
        if (filter === 'coalition') return item.statusType === 'coalition';
      });

      filteredData.forEach(item => {
        const liveItem = (typeof autoData !== 'undefined') ? autoData.find(a => a.city === item.city) : null;
        const hasNewFormat = liveItem && typeof liveItem.blueScore !== 'undefined';

        const total = item.bluePct + item.greenPct;
        const blueWidth = (item.bluePct / total) * 100;
        const greenWidth = (item.greenPct / total) * 100;
        const barColorClass = item.blueClass === 'tpp' ? 'bar-other' : 'bar-kmt';
        const rightBarClass = (item.greenClass === 'ind' || item.greenClass === 'none-cand') ? 'bar-other' : 'bar-dpp';
        
        const pollListHtml = item.pollCompare.map(line => `<div>${line}</div>`).join('');
        const socialDetailHtml = item.socialDetail.map(line => `<div>${line}</div>`).join('');
        const socialTagsHtml = item.socialTags.map(tag => `
          <div class="social-item">
            <span class="plat-badge plat-${tag.platform}">${tag.platform}</span>
            <span>${tag.text}</span>
          </div>
        `).join('');

        const summaryHtml = hasNewFormat ? `<br><span class="bot-summary">${liveItem.summary}</span>` : '';
        const blueBadge = hasNewFormat ? makeScoreBadge(liveItem.blueScore, liveItem.blueLogs, item.blueCand) : '';
        const greenBadge = (hasNewFormat && item.greenClass !== 'none-cand') ? makeScoreBadge(liveItem.greenScore, liveItem.greenLogs, item.greenCand) : '';

        const newsTitleHtml = liveItem
          ? `<span class="live-tag">LIVE</span>${liveItem.latestHeadline}`
          : `📰 ${item.newsHeadline}`;
        const newsTooltipTitle = liveItem
          ? `${item.city}｜🤖 機器人最新抓取新聞`
          : `${item.city}最新戰況`;
        const newsTooltipBody = liveItem
          ? liveItem.allNews.map((n, i) => `<div>${i + 1}. ${n}</div>`).join('')
          : `<div>${item.newsDetail}</div>`;

        const row = `
          <tr>
            <td><strong>${item.city}</strong></td>
            <td>
              <span class="badge status-${item.statusType}">${item.statusText}</span>
              ${summaryHtml}
            </td>
            <td class="${item.blueClass}">${item.blueCand}${blueBadge}</td>
            <td class="${item.greenClass}">${item.greenCand}${greenBadge}</td>
            <td>
              <div class="hover-trigger">
                <span class="poll-text">📊 ${item.pollNote}</span>
                <div class="tooltip">
                  <span class="tooltip-title">${item.city}｜各家機構數據對照</span>
                  <div class="detail-list">${pollListHtml}</div>
                </div>
              </div>
              <div class="poll-bar-container">
                <div class="${barColorClass}" style="width: ${blueWidth}%"></div>
                <div class="${rightBarClass}" style="width: ${greenWidth}%"></div>
              </div>
            </td>
            <td>
              <div class="hover-trigger" style="width: 100%;">
                <div class="social-list">${socialTagsHtml}</div>
                <div class="tooltip">
                  <span class="tooltip-title">${item.city}｜三大社群風向與爆料明細</span>
                  <div class="detail-list">${socialDetailHtml}</div>
                </div>
              </div>
            </td>
            <td class="right-col" style="text-align: left;">
              <div class="hover-trigger">
                ${newsTitleHtml}
                <div class="tooltip">
                  <span class="tooltip-title">${newsTooltipTitle}</span>
                  <div class="detail-list">${newsTooltipBody}</div>
                </div>
              </div>
            </td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    function filterTable(type, btnElement) {
      document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderTable(type);
    }

    renderTable();
  </script>
